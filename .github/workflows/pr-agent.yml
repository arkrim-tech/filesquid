# AI PR Agent. Reviews pull requests. Does not build or test the repository.
# Quality gates stay in scripts/pre-commit.sh (.agents/rules/local-verification.md).
# OPENAI_KEY is a repository Actions secret. Set config.model here when the model is chosen.
# A later self-hosted review server may replace this file.
name: AI PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: AI PR Agent
    steps:
      - name: Review the pull request
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
