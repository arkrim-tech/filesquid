[package]
name = "filesquid-desktop"
version = "0.1.0"
edition.workspace = true
description = "Tauri 2 desktop host for FileSquid and its distributions. Privileged work stays in Rust."
license.workspace = true
publish = false

[lib]
name = "filesquid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "filesquid-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1"

[dependencies]
axum = "0.8"
filesquid-api = { path = "../api" }
filesquid-native = { path = "../native", features = ["desktop"] }
filesquid-core = { path = "../core" }
filesquid-ocfl = { path = "../ocfl" }
filesquid-metadata = { path = "../metadata" }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tracing`: Tauri reports its own IPC handling (the `postMessage` path and the invoke-key
# check) as tracing spans and events, which the host journals (`ipc_observer`, Task DE-0.9).
tauri = { version = "2.11.5", features = ["tracing"] }
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Test-instrumented build for the packaged-window tests (ADR 017, ADR 035): registers the
# embedded WebDriver server (which listens on 127.0.0.1) and the 100 MB range fixture.
# Never enabled in a shipping build.
test-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# `test`: the mock runtime, so the IPC gate and the window guards run against real Tauri code.
tauri = { version = "2.11.5", features = ["test"] }
cucumber = { version = "0.23", features = ["macros", "output-junit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The `log` facade Tauri logs through, to prove its records reach the stdout JSON stream.
log = "0.4"

[[test]]
name = "integration_api_protocol"
path = "tests/integration/api_protocol.rs"

[[test]]
name = "integration_event_channel"
path = "tests/integration/event_channel.rs"

[[test]]
name = "integration_capabilities"
path = "tests/integration/capabilities.rs"

[[test]]
name = "integration_ipc_gate"
path = "tests/integration/ipc_gate.rs"

[[test]]
name = "integration_host_events"
path = "tests/integration/host_events.rs"

[[test]]
name = "integration_library_catalog"
path = "tests/integration/library_catalog.rs"

[[test]]
name = "integration_stdout_logging"
path = "tests/integration/stdout_logging.rs"

[[test]]
name = "integration_range_fixture"
path = "tests/integration/range_fixture.rs"
required-features = ["test-webdriver"]

[[test]]
name = "features"
path = "tests/features.rs"
required-features = ["test-webdriver"]
harness = false
