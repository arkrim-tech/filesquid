[package]
name = "filesquid-ocfl"
version = "0.1.0"
edition = "2021"
description = "FileSquid OCFL 1.1 module. Installable without the FileSquid app; builds and publishes without other FileSquid crates. Git MUST NOT be the OCFL store."
license = "MIT"
publish = false
# The pinned OCFL community fixtures are test data only: never packaged with
# the crate or loaded by it (OCFL-S-011).
exclude = ["tests/fixtures/"]

[lib]
path = "src/lib.rs"

[features]
# `fs` ships the local filesystem storage backend and the path-based
# logical-file helpers. It is native only: on wasm32 the backend is compiled
# out even when the feature is on (ADR 025).
default = ["fs"]
fs = []

[dependencies]
# Inventory JSON. Default features off (as filesquid-c2pa), so the crate
# still builds for wasm32-unknown-unknown; `std` is all it needs.
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.11"
# Fixity algorithms a validator must verify besides sha256 and sha512
# (OCFL 1.1 fixity table, E027): md5, sha1 and blake2b-512. Read only; the
# engine never writes them (ADR 009). Pure Rust, so wasm32 still builds.
md-5 = "0.11"
sha1 = "0.11"
blake2 = "0.11"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
cucumber = { version = "0.23", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "unit_git_guard"
path = "tests/unit/git_guard.rs"

[[test]]
name = "integration_hierarchy_guard"
path = "tests/integration/hierarchy_guard.rs"
required-features = ["fs"]

[[test]]
name = "unit_digest"
path = "tests/unit/digest.rs"

[[test]]
name = "unit_inventory"
path = "tests/unit/inventory.rs"

[[test]]
