[package]
name = "filesquid-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "FileSquid native processing: the host-side I/O (SQLite operational store, data-directory checks) that the FileSquid hosts inject into filesquid-api."
publish = false

[lib]
path = "src/lib.rs"

[features]
# The SQLite journal store, the data-directory checks and HostMonitor are always built; they
# are all `filesquid-server` may use (ADR 033 amendment 2026-10-18).
default = []
# Desktop-only native processing: the per-library SQLite catalog (DE-0.2) and its OCFL
# snapshot commits and reconcile (DE-0.3), the durable job workers (DE-0.4, DE-0.8), and
# later the media workers (DE-0.5). Only `filesquid-desktop` enables it; a `filesquid-server` test fails if the
# server does.
desktop = ["dep:libloading"]

[dependencies]
filesquid-api = { path = "../api" }
# Domain types of the library catalog (files, collections, virtual collections, folders).
filesquid-core = { path = "../core" }
# The OCFL engine: its storage-backend trait for the OCFL validation service (API-S-022), its
# filesystem backend and leases for the file service every host installs (API-F1.3), and,
# with `desktop`, its change model for the desktop's canonical snapshot commits (DE-0.3).
filesquid-ocfl = { path = "../ocfl", default-features = false, features = ["fs"] }
fs4 = "1"
# The digest that names each library's folder in the data directory.
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tracing = "0.1"
# Loads libvips at run time inside the media worker process only (Task DE-0.5, ADR 006), so
# no build needs libvips headers and a machine without libvips gets a clear refusal.
libloading = { version = "0.7", optional = true }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for owner-only files, so a symbolic link is never followed.
libc = "0.2"

[dev-dependencies]
cucumber = { version = "0.23", features = ["macros", "output-junit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "unit_journal"
path = "tests/unit/journal.rs"

[[test]]
name = "unit_files"
path = "tests/unit/files.rs"

[[test]]
name = "unit_findings"
path = "tests/unit/findings.rs"

[[test]]
name = "unit_installation"
path = "tests/unit/installation.rs"

[[test]]
name = "unit_host"
path = "tests/unit/host.rs"

[[test]]
name = "unit_jobs"
path = "tests/unit/jobs.rs"

[[test]]
name = "unit_media"
path = "tests/unit/media.rs"
required-features = ["desktop"]

[[test]]
name = "features"
path = "tests/features.rs"
harness = false

[[test]]
name = "unit_catalog"
path = "tests/unit/catalog.rs"
required-features = ["desktop"]

[[test]]
name = "catalog_features"
path = "tests/catalog_features.rs"
required-features = ["desktop"]
harness = false

[[test]]
name = "unit_canonical_commit"
path = "tests/unit/canonical_commit.rs"
required-features = ["desktop"]

[[test]]
name = "unit_library_host"
path = "tests/unit/library_host.rs"
required-features = ["desktop"]
