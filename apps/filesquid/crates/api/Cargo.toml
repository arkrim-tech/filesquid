[package]
name = "filesquid-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The single FileSquid API: versioned contract, transport-agnostic router and event bus shared by every FileSquid host."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
filesquid-core = { path = "../core" }
# The OCFL engine, without its filesystem backend: hosts inject the storage root (API-S-006).
filesquid-ocfl = { path = "../ocfl", default-features = false }
# The per-file metadata record (`FileRecord`, the only codec of `<file-uuid>.metadata.md`), the
# namespace registry and the `ocfl` store (API-S-026, MD-S-008, MD-S-012), without the native
# sidecar store: the API does no filesystem I/O (API-S-006).
filesquid-metadata = { path = "../metadata", default-features = false, features = ["ocfl"] }
# PROV-O records and the history index, with records in OCFL objects (API-S-028, API-S-029).
filesquid-prov = { path = "../prov", features = ["ocfl"] }
# Streams of the whole-file download (API-S-011).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
# NFC normalisation of search queries and names (API-S-012, SRS-F-063): already in the lockfile
# through the URL crates, pinned to that version so no new crate enters the build.
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[dev-dependencies]
# The engine with its filesystem backend, for tests on a real directory only (the OCFL
# validation tests and the API-F1.3 file integration tests).
filesquid-ocfl = { path = "../ocfl" }
cucumber = { version = "0.23", features = ["macros", "output-junit"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

