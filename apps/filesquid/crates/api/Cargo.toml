[package]
name = "filesquid-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The single FileSquid API: versioned contract, transport-agnostic router and event bus shared by every FileSquid host."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
filesquid-core = { path = "../core" }
# The OCFL engine, without its filesystem backend: hosts inject the storage root (API-S-006).
filesquid-ocfl = { path = "../ocfl", default-features = false }
# PROV-O records and the history index, with records in OCFL objects (API-S-028, API-S-029).
filesquid-prov = { path = "../prov", features = ["ocfl"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[dev-dependencies]
# The engine with its filesystem backend, for tests on a real directory only (the OCFL
# validation tests and the API-F1.3 file integration tests).
filesquid-ocfl = { path = "../ocfl" }
cucumber = { version = "0.23", features = ["macros", "output-junit"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

