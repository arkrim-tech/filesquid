# FileSquid Cargo workspace. Product-local: the repository root has no Cargo.toml.
# Each module crate MUST build and test on its own (`cargo test -p <crate>`).
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/native",
    "crates/ocfl",
    "crates/metadata",
    "crates/c2pa",
    "crates/cli",
    "crates/server",
    "crates/desktop",
]

[workspace.package]
edition = "2021"
license = "MIT"
